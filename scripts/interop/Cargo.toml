[package]
name = "nail-interop"
description = "Nail's mail and DAV engines against real servers (Dovecot, Stalwart, Radicale); runs with NAIL_INTEROP=1"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
publish = false

# Not a member of the main workspace: the CI interop job runs it on Linux
# (servers in containers), where the Tauri shell is not built. The engine
# crates are path dependencies; CI copies the root Cargo.lock here first so
# the versions match (scripts/interop/README.md).
[workspace]

[dependencies]
base64 = "0.23.1"

[dev-dependencies]
nail-api = { path = "../../crates/nail-api" }
nail-dav = { path = "../../crates/nail-dav" }
nail-discovery = { path = "../../crates/nail-discovery" }
nail-proto-imap = { path = "../../crates/nail-proto-imap" }
nail-proto-pop3 = { path = "../../crates/nail-proto-pop3" }
nail-proto-smtp = { path = "../../crates/nail-proto-smtp" }
nail-sieve = { path = "../../crates/nail-sieve" }
nail-testkit = { path = "../../crates/nail-testkit" }
nail-testkit-net = { path = "../../crates/nail-testkit-net" }
url = "2.5.8"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }

# The workspace lints (root Cargo.toml, ADR 0123), repeated because this crate
# is its own workspace (pinned by scripts/test/interop-lints.test.mjs). CI's
# interop job runs clippy with -D warnings on it.
[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_lifetimes = "warn"
let_underscore_drop = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"
large_futures = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
needless_pass_by_ref_mut = "warn"
