# Dovecot 2.3 for Nail's interop tests (scripts/interop). The whole config,
# replacing the image's: IMAP (143 STARTTLS, 993 TLS) and POP3 (110 STLS,
# 995 TLS), any user name with the password "nail-interop", maildirs in
# /tmp. Certificates from gen-certs.sh are mounted at /etc/dovecot/certs.

protocols = imap pop3
listen = *

ssl = required
ssl_cert = </etc/dovecot/certs/server.pem
ssl_key = </etc/dovecot/certs/server.key
ssl_min_protocol = TLSv1.2

disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_verbose = yes

passdb {
  driver = static
  args = password=nail-interop
}
userdb {
  driver = static
  args = uid=nobody gid=nogroup home=/tmp/mail/%u
}

mail_location = maildir:~/Maildir
namespace inbox {
  inbox = yes
  separator = /
}

pop3_uidl_format = %08Xu%08Xv

log_path = /dev/stderr
info_log_path = /dev/stdout
