# Dovecot 2.3 for Nail's interop tests (scripts/interop). The whole config,
# replacing the image's: IMAP (143 STARTTLS, 993 TLS), POP3 (110 STLS,
# 995 TLS) and ManageSieve (4190 STARTTLS, Pigeonhole; M2c), any user name
# with the password "nail-interop", maildirs and scripts in /tmp.
# Certificates from gen-certs.sh are mounted at /etc/dovecot/certs.
#
# The official dovecot/dovecot 2.3 images ship Pigeonhole (sieve,
# managesieve). Not verified locally (no Docker on the development
# machine): check the CI job log after an image upgrade.

protocols = imap pop3 sieve
listen = *

ssl = required
ssl_cert = </etc/dovecot/certs/server.pem
ssl_key = </etc/dovecot/certs/server.key
ssl_min_protocol = TLSv1.2

disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_verbose = yes

passdb {
  driver = static
  args = password=nail-interop
}
userdb {
  driver = static
  args = uid=nobody gid=nogroup home=/tmp/mail/%u
}

mail_location = maildir:~/Maildir
namespace inbox {
  inbox = yes
  separator = /
}

pop3_uidl_format = %08Xu%08Xv

# ManageSieve (Pigeonhole): personal scripts in ~/sieve, the active one
# linked from ~/.dovecot.sieve. The extensions are Pigeonhole's defaults
# plus regex (Nail compiles rules with `:regex` where the server has it).
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}
protocol sieve {
  managesieve_max_line_length = 65536
}
plugin {
  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_extensions = +regex +imap4flags +vacation-seconds
}

log_path = /dev/stderr
info_log_path = /dev/stdout
