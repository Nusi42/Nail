[workspace]
resolver = "3"
members = [
    "crates/nail-api",
    "crates/nail-config",
    "crates/nail-store",
    "crates/nail-mime",
    "crates/nail-proto-imap",
    "crates/nail-proto-smtp",
    "crates/nail-proto-pop3",
    "crates/nail-auth",
    "crates/nail-discovery",
    "crates/nail-search",
    "crates/nail-testkit",
    "crates/nail-testkit-net",
    "crates/nail-compose",
    "crates/nail-rules",
    "crates/nail-mcp",
    "crates/nail-pgp",
    "crates/nail-smime",
    "crates/nail-vault",
    "crates/nail-remote-auth",
    "crates/nail-proxy",
    "crates/nail-sieve",
    "crates/nail-triage",
    "crates/nail-plugins",
    "crates/nail-ical",
    "crates/nail-dav",
    "crates/nail-core",
    "crates/nail-server",
    "crates/nail-cli",
    "app/src-tauri",
]
# The Tauri shell needs the built UI (`ui/dist`) at compile time, so plain
# `cargo build` / `cargo test` skip it. Use `--workspace` (after `npm run build`)
# or `-p nail-app` to include it.
default-members = [
    "crates/nail-api",
    "crates/nail-config",
    "crates/nail-store",
    "crates/nail-mime",
    "crates/nail-proto-imap",
    "crates/nail-proto-smtp",
    "crates/nail-proto-pop3",
    "crates/nail-auth",
    "crates/nail-discovery",
    "crates/nail-search",
    "crates/nail-testkit",
    "crates/nail-testkit-net",
    "crates/nail-compose",
    "crates/nail-rules",
    "crates/nail-mcp",
    "crates/nail-pgp",
    "crates/nail-smime",
    "crates/nail-vault",
    "crates/nail-remote-auth",
    "crates/nail-proxy",
    "crates/nail-sieve",
    "crates/nail-triage",
    "crates/nail-plugins",
    "crates/nail-ical",
    "crates/nail-dav",
    "crates/nail-core",
    "crates/nail-server",
    "crates/nail-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://example.invalid/nail"

[workspace.dependencies]
# Internal crates
nail-api = { path = "crates/nail-api" }
nail-config = { path = "crates/nail-config" }
nail-store = { path = "crates/nail-store" }
nail-mime = { path = "crates/nail-mime" }
nail-proto-imap = { path = "crates/nail-proto-imap" }
nail-proto-smtp = { path = "crates/nail-proto-smtp" }
nail-proto-pop3 = { path = "crates/nail-proto-pop3" }
nail-auth = { path = "crates/nail-auth" }
nail-discovery = { path = "crates/nail-discovery" }
nail-search = { path = "crates/nail-search" }
nail-testkit = { path = "crates/nail-testkit" }
nail-testkit-net = { path = "crates/nail-testkit-net" }
nail-compose = { path = "crates/nail-compose" }
nail-rules = { path = "crates/nail-rules" }
nail-mcp = { path = "crates/nail-mcp" }
nail-pgp = { path = "crates/nail-pgp" }
nail-smime = { path = "crates/nail-smime" }
nail-vault = { path = "crates/nail-vault" }
nail-remote-auth = { path = "crates/nail-remote-auth" }
nail-proxy = { path = "crates/nail-proxy" }
nail-sieve = { path = "crates/nail-sieve" }
nail-triage = { path = "crates/nail-triage" }
nail-plugins = { path = "crates/nail-plugins" }
nail-ical = { path = "crates/nail-ical" }
nail-dav = { path = "crates/nail-dav" }
nail-core = { path = "crates/nail-core" }
nail-server = { path = "crates/nail-server" }

# Serialization and contract
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
indexmap = { version = "2.14", features = ["serde"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "indexmap-impl"] }

# Errors, async, logging
thiserror = "2.0.21"
anyhow = "1.0.104"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# Mail, TLS, storage (shared by several crates)
mail-parser = "0.11.9"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

# M1a engines (ADR 0012). TLS everywhere is rustls with the `ring` provider,
# chosen explicitly per connection (no aws-lc, no process-wide default).
# SMTP submission: tokio + rustls, raw MIME is built elsewhere.
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "pool", "hostname", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
# OS keychain (Windows Credential Manager, macOS Keychain, Secret Service).
keyring = "4.2.0"
# OAuth2 client (PKCE, token exchange/refresh); HTTP through our reqwest.
oauth2 = { version = "5.0.0", default-features = false }
# HTTP client for OAuth2 and autoconfig; TLS config supplied by the caller.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "charset", "http2"] }
url = "2.5.8"
rustls-platform-verifier = "0.7.1"
# DNS (RFC 6186 SRV lookups; mock DNS answers in tests).
hickory-resolver = "0.26.3"
hickory-proto = "0.26.3"
# Autoconfig / Autodiscover XML.
quick-xml = "0.42.0"
# Full-text search.
tantivy = "0.26.2"
base64 = "0.23.1"

# M1b (ADR 0022). Composer: MIME building, Markdown, CSS inlining; the
# sanitizer (ammonia) is already used by nail-mime.
mail-builder = "1.0.0"
# Syntax highlighting through syntect's pure-Rust regex engine (no oniguruma C build).
comrak = { version = "0.55.0", default-features = false, features = ["syntect-fancy"] }
# No `http` / `file` features: stylesheets are passed in, never fetched.
css-inline = { version = "0.21.2", default-features = false }
ammonia = "4.2.0"
# Rules: regex conditions.
regex = "1.13.1"
# MCP server (Streamable HTTP + stdio) and client (tests).
# Server side here; tests add `client` + `transport-streamable-http-client-reqwest`
# (reqwest stays on the workspace's `rustls-no-provider` build, no aws-lc).
rmcp = { version = "3.5.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }

# M2a (ADR 0029). Licences: MIT / Apache-2.0 / BSD only (no GPL family;
# Sequoia-PGP is LGPL, so OpenPGP uses rPGP). No OpenSSL: everything below
# is pure Rust, plus the `windows` crate for the certificate store.
# rPGP pins the stable RustCrypto generation (digest 0.10, rsa 0.9,
# p256 0.13, aes-gcm 0.10, rand 0.8); S/MIME and the vault use the same one
# so every primitive is compiled once. (`sha2` above is digest 0.11, used for
# ids and blob hashes; `sha2-legacy` is the 0.10 generation for crypto.)
pgp = "0.20.0"
rand = "0.8.5"
zeroize = "1.9.0"
# WKD (z-base32 of SHA-1 of the local part) and legacy S/MIME digests.
sha1 = "0.10.6"
sha2-legacy = { package = "sha2", version = "0.10.9", features = ["oid"] }
# S/MIME: CMS SignedData / EnvelopedData, certificates, PKCS#12.
cms = { version = "0.2.3", features = ["builder"] }
x509-cert = { version = "0.2.5", features = ["builder"] }
der = { version = "0.7.10", features = ["std"] }
spki = "0.7.3"
const-oid = { version = "0.9.6", features = ["db"] }
rsa = "0.9.10"
p256 = "0.13.2"
p384 = "0.13.1"
ecdsa = "0.16.9"
aes = "0.8.4"
cbc = "0.1.2"
aes-gcm = "0.10.3"
p12-keystore = "0.2.1"
# RFC 3394 AES key wrap (S/MIME ECDH recipients) and PBKDF2 (passphrase-
# protected S/MIME keys); both already in the lock through rPGP / p12-keystore.
aes-kw = { version = "0.2.1", features = ["alloc"] }
pbkdf2 = "0.12.2"
# Windows certificate store (CryptoAPI / CNG); only on Windows targets.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
# Network interfaces (GetAdaptersAddresses) for the remote UI's LAN address,
# without opening a socket (ADR 0057). MIT / Apache-2.0; already in the lock
# through hickory-resolver. Windows only.
ipconfig = { version = "0.3.4", default-features = false }
# Encryption at rest: XChaCha20-Poly1305 for blobs and index files.
chacha20poly1305 = "0.10.1"
# Link safety in nail-mime: IDNA / punycode and UTS #39 confusables.
idna = "1.1.0"
unicode-security = "0.1.2"

# M2b (ADR 0036). Licences: MIT / Apache-2.0 / BSD / ISC only; no OpenSSL,
# no aws-lc (ring everywhere). webauthn-rs (the plan's choice) needs OpenSSL,
# so passkeys use the pure-Rust webauthn_rp (same RustCrypto generation as
# rPGP: p256 / p384 0.13, rsa 0.9, ed25519-dalek 2).
# Remote-UI authentication (nail-remote-auth, WP41).
webauthn_rp = "0.3.0"
argon2 = "0.6.0"
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "otpauth"] }
cookie = "0.18.1"
# Remote-content proxy URL signing (nail-proxy, WP42): HMAC-SHA-256 on the
# workspace `sha2` 0.11 generation.
hmac = "0.13.0"
ipnet = "2.12.2"
# Remote-UI TLS (nail-server, WP42): TLS 1.3 / 1.2 with rustls + ring,
# self-signed certificates, ACME (usable only in the locked internet mode).
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls"] }

# M2c (ADR 0043). Licences: MIT / Apache-2.0 only; no OpenSSL.
# nail-sieve (WP51) uses the workspace tokio / rustls (ring) / base64 /
# regex; nail-triage (WP52) the workspace chrono plus word boundaries:
unicode-segmentation = "1.13.2"
# Fluent in Rust (localized core messages rendered by the CLI and OS
# notifications; nail-config `l10n`, WP53): the same `.ftl` catalogs as the UI.
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
# Desktop OS notifications (the shell shows `NotificationRequested`, WP55).
tauri-plugin-notification = "2.5.0"

# M2d (ADR 0050). Plug-in host (nail-plugins, WP61). Licences: MIT only.
# QuickJS through rquickjs: the QuickJS-NG C sources are compiled by `cc`
# (MSVC works; no bindgen / libclang: pre-generated bindings are used).
# `futures`: async host functions (the Client API is async); `loader`: ES
# module loading of the bundled entry; `macro` / `classes` / `properties`:
# binding the `nail.*` API. Memory limits and interrupt handlers are core
# features.
rquickjs = { version = "0.14.0", features = ["futures", "loader", "macro", "classes", "properties"] }
# `.nailplugin` archives (zip): deflate through zlib-rs (pure Rust, Zlib
# licence); no bzip2 / zstd / lzma C code, no AES.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# M3a (ADR 0058). Calendars, contacts and tasks. Licences: Apache-2.0 / MIT.
# iCalendar / vCard parsing and writing, RRULE expansion and zone detection
# (nail-ical, WP71): calcard from Stalwart Labs (Apache-2.0 OR MIT); the
# JSCalendar / JSContact (`jmap`) feature is off. Its RRULE engine is a port
# of rust-rrule. CalDAV / CardDAV (nail-dav, WP72) uses the workspace
# reqwest + quick-xml; no new HTTP or XML library.
calcard = { version = "0.3.14", default-features = false }
# IANA zones for chrono (the same version calcard uses).
chrono-tz = "0.10.4"

# Hashing (ids, blob addresses)
sha2 = "0.11.0"
hex = "0.4.3"

# HTTP / WebSocket server
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tower = { version = "0.5.3", features = ["util"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.30.0"

# Dates (local UTC offset, RFC 2822 / 3339)
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
notify-debouncer-mini = { version = "0.7.0", default-features = false }

# CLI and platform paths
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0.0"
open = "5.4.4"

# Desktop shell
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
# A second start (a mailto: click while Nail runs) hands its arguments to
# the running app (MIT / Apache-2.0; ADR 0041).
tauri-plugin-single-instance = "2.5.1"

# Testing
tempfile = "3.27"
pretty_assertions = "1.4"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
large_futures = "warn"
needless_pass_by_ref_mut = "warn"

[profile.dev]
# Keep debug builds reasonably fast while still debuggable.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
