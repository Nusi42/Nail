[package]
name = "nail-plugins"
description = "Nail's plug-in host: one sandboxed QuickJS runtime per plug-in, the permission gate, the preview API bindings and .nailplugin packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nail-api.workspace = true
nail-util.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# One QuickJS runtime per plug-in (memory limit, interrupt handler for the
# CPU budget; no std / os modules are ever loaded).
rquickjs.workspace = true
# `.nailplugin` archives.
zip.workspace = true
# Package hashes (SHA-256, hex).
sha2.workspace = true
hex.workspace = true
# `nail.http.fetch` URL checks against `network:` permissions.
url.workspace = true
# Hot reload of dev plug-ins (`nail plugin dev`).
notify-debouncer-mini.workspace = true
# Package assets inlined into `image` nodes as `data:` URIs.
base64.workspace = true
# Unguessable dialog ids.
rand.workspace = true
# `%fluent-id%` texts of manifests from the plug-in's own catalogs.
fluent-bundle.workspace = true
unic-langid.workspace = true
# Ranges of `nail.calendar.events` (M3a); job schedules (M4a).
chrono.workspace = true
# M4a: HTML a plug-in hands back (Markdown blocks, before-send content) is
# sanitized like a message body before it leaves the host.
nail-mime.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# The CPU time of a plug-in's thread (its budgets, ADR 0204).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
