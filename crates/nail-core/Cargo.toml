[package]
name = "nail-core"
description = "Nail service: routes requests, owns store, config and sync, emits events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["demo"]
# Demo data (`seed_demo`), in-process mock servers (`start_demo_imap`,
# `start_demo_multi`) from nail-testkit / nail-testkit-net, used by
# `nail serve --seed`.
# `nail-proxy/test-support` lets demo-multi reach its mock image server on
# one loopback port (only when a seed configures it; ADR 0041).
# `nail-proto-gmail/testing`: demo-multi's mock Gmail account (M3b);
# `nail-proto-graph/testing`, `nail-proto-ews/testing`, `nail-exchange/testing`:
# demo-multi's mock Graph / EWS accounts and mock Autodiscover (M3c).
demo = [
    "dep:nail-testkit",
    "dep:nail-testkit-net",
    "nail-proxy/test-support",
    "nail-proto-gmail/testing",
    "nail-proto-graph/testing",
    "nail-proto-ews/testing",
    "nail-exchange/testing",
]

[dependencies]
zeroize.workspace = true
# M4c (ADR 0094): imports / exports / backups / diagnostics (WP121) and
# smartcards (WP122), wired by WP125.
nail-portability.workspace = true
nail-pkcs11.workspace = true
nail-api.workspace = true
nail-config.workspace = true
nail-store.workspace = true
nail-mime.workspace = true
nail-search.workspace = true
nail-auth.workspace = true
nail-discovery.workspace = true
nail-proto-imap.workspace = true
nail-proto-smtp.workspace = true
nail-proto-pop3.workspace = true
nail-compose.workspace = true
nail-rules.workspace = true
nail-mcp.workspace = true
# M2a: OpenPGP / Autocrypt, S/MIME, encryption at rest (ADRs 0030-0032).
nail-pgp.workspace = true
nail-smime.workspace = true
nail-vault.workspace = true
# M2b: remote-UI authentication and the remote-content proxy (ADRs 0037, 0038).
nail-remote-auth.workspace = true
nail-proxy.workspace = true
# M2c: Sieve / ManageSieve and the junk, snooze and notification logic (ADRs 0044, 0045).
nail-sieve.workspace = true
nail-triage.workspace = true
# M3a: iCalendar / vCard and the CalDAV / CardDAV client (ADRs 0059, 0060, 0063).
nail-ical.workspace = true
nail-dav.workspace = true
# M3b: iTIP / iMIP and the Gmail API engine (ADRs 0066, 0067, 0070).
nail-itip.workspace = true
nail-proto-gmail.workspace = true
# M3c: the Graph and EWS engines and the Exchange common layer (ADRs 0073-0075, 0077).
nail-proto-graph.workspace = true
nail-proto-ews.workspace = true
nail-exchange.workspace = true
chrono-tz.workspace = true
iana-time-zone.workspace = true
rand.workspace = true
url.workspace = true
nail-testkit = { workspace = true, optional = true }
nail-testkit-net = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
reqwest.workspace = true
# M2d: the plug-in host and its HTTP client (ADR 0055).
nail-plugins.workspace = true
rustls.workspace = true
chrono.workspace = true
open.workspace = true
notify-debouncer-mini.workspace = true

[dev-dependencies]
# An MCP client for the test of the core-started server's subscriptions.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
nail-testkit.workspace = true
nail-testkit-net.workspace = true
nail-proto-gmail = { workspace = true, features = ["testing"] }
nail-proto-graph = { workspace = true, features = ["testing"] }
nail-proto-ews = { workspace = true, features = ["testing"] }
nail-exchange = { workspace = true, features = ["testing"] }
# Cheap Argon2id for backup tests (production uses KdfParams::STANDARD) and the
# in-memory PKCS#11 token for smartcard tests (M4c).
nail-portability = { workspace = true, features = ["testing"] }
nail-pkcs11 = { workspace = true, features = ["testing"] }
# The soft token's RSA key from the S/MIME corpus (PKCS#8 PEM).
rsa.workspace = true
tempfile.workspace = true
zeroize.workspace = true
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
