[package]
name = "nail-core"
description = "Nail service: routes requests, owns store, config and sync, emits events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["demo"]
# Demo data (`seed_demo`) and an in-process mock IMAP server
# (`start_demo_imap`) from nail-testkit, used by `nail serve --seed`.
demo = ["dep:nail-testkit"]

[dependencies]
nail-api.workspace = true
nail-config.workspace = true
nail-store.workspace = true
nail-mime.workspace = true
nail-proto-imap.workspace = true
nail-testkit = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
dirs.workspace = true

[dev-dependencies]
nail-testkit.workspace = true
tempfile.workspace = true
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
