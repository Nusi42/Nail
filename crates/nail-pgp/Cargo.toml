[package]
name = "nail-pgp"
description = "OpenPGP for Nail (rPGP): keyring, PGP/MIME sign / encrypt / decrypt / verify, Autocrypt, key discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# M4c WP122 (ADR 0094): keys on PKCS#11 smartcards.
nail-pkcs11.workspace = true
nail-net.workspace = true
nail-util.workspace = true
nail-api.workspace = true
# The keyring and Autocrypt peer state live in the store (schema v5).
nail-store.workspace = true
pgp.workspace = true
rand.workspace = true
zeroize.workspace = true
# WKD: z-base32(SHA-1(local part)).
sha1.workspace = true
thiserror.workspace = true
chrono.workspace = true
base64.workspace = true
mail-parser.workspace = true
# M4c WP122: matching card keys with OpenPGP keys (the RustCrypto types
# rPGP uses) and the JSON smartcard key reference.
rsa.workspace = true
p256.workspace = true
hex.workspace = true
serde_json.workspace = true

[dev-dependencies]
nail-testkit.workspace = true
# Smartcard tests on the in-memory soft token.
nail-pkcs11 = { workspace = true, features = ["testing"] }
pretty_assertions.workspace = true

[lints]
workspace = true
