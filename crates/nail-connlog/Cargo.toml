[package]
name = "nail-connlog"
description = "The connection log (ADR 0190): the one redactor for every protocol and the diagnostics bundle, wire taps, in-memory rings and rotating log files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nail-api.workspace = true
# Entry timestamps (RFC 3339 with milliseconds).
chrono.workspace = true
# Certificate summaries (subject, issuer, expiry) of TLS connections.
x509-cert.workspace = true
der.workspace = true
sha2.workspace = true
hex.workspace = true
serde_json.workspace = true
# The negotiated parameters of the line protocols' TLS sessions.
rustls.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
# The "no secret survives" property test; same as nail-triage / nail-search.
proptest = "1.11"
tempfile.workspace = true

[lints]
workspace = true
