[package]
name = "nail-mapi"
description = "Nail's Simple MAPI provider: NailMapi.dll forwards MAPISendMail(W) to the running app (M4b WP111)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The DLL (`nail_mapi.dll`, shipped as `mapi\<arch>\NailMapi.dll`) and an
# rlib so the unit / integration tests can call the logic directly.
[lib]
name = "nail_mapi"
crate-type = ["cdylib", "rlib"]

# Test harness (WP111 / WP115 e2e): loads the DLL and calls its exports
# like a program would ("Send to → Mail recipient").
[[bin]]
name = "nail-mapi-harness"
path = "src/bin/harness.rs"

[dependencies]
# The pipe protocol and request types (nail_api::mapi).
nail-api.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Mapi",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
