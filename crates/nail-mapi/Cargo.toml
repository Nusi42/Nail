[package]
name = "nail-mapi"
description = "Nail's Simple MAPI provider: NailMapi.dll forwards MAPISendMail(W) to the running app (M4b WP111)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The DLL (`nail_mapi.dll`, shipped as `mapi\<arch>\NailMapi.dll`) and an
# rlib so the unit / integration tests can call the logic directly.
[lib]
name = "nail_mapi"
crate-type = ["cdylib", "rlib"]

# Test harness (WP111 / WP115 e2e): loads the DLL and calls its exports
# like a program would ("Send to → Mail recipient"); without arguments it
# plays a fake Nail.exe serving the pipe once.
[[bin]]
name = "nail-mapi-harness"
path = "src/bin/harness.rs"

[features]
# Test-only (M4b review): honour NAIL_MAPI_PIPE (another pipe) and
# NAIL_MAPI_APP (the program to start) from the calling process's
# environment. The DLL runs inside arbitrary programs, so a shipped DLL must
# never let an environment variable pick its pipe or start a program:
# installer and release builds never enable this. The tests below and the
# e2e desktop build (e2e/scripts/build-desktop.mjs) do.
test-overrides = []

[dependencies]
# The pipe protocol and request types (nail_api::mapi).
nail-api.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Mapi",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# Install directory fallback (`HKCU|HKLM\Software\Nail\Install`).
windows-registry.workspace = true

[dev-dependencies]
# The crate itself with the test-only overrides, for its unit and DLL tests
# (dev-dependencies never reach `cargo build -p nail-mapi`).
nail-mapi = { path = ".", features = ["test-overrides"] }
tempfile.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
