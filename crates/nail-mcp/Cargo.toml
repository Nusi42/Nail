[package]
name = "nail-mcp"
description = "MCP server: resources and tools over Streamable HTTP and stdio, grants and audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nail-api.workspace = true
nail-store.workspace = true
nail-mime.workspace = true
# TLS configuration for the bridge's reqwest client (the workspace builds
# reqwest with `rustls-no-provider`, ADR 0014); the bridge itself only talks
# plain HTTP to 127.0.0.1.
nail-auth.workspace = true
# Server side plus the Streamable HTTP client the stdio bridge forwards with.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["io-std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
# Bearer tokens (32 random bytes from the OS).
getrandom = "0.3.4"

[dev-dependencies]
# The English catalog checks every user-facing message id (core.ftl).
nail-config.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
