[package]
name = "nail-mcp"
description = "MCP server: resources and tools over Streamable HTTP and stdio, grants and audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `json-schema`: the write tools' input schemas come from nail-api's argument types (M4a).
nail-api = { workspace = true, features = ["json-schema"] }
nail-store.workspace = true
nail-mime.workspace = true
# TLS configuration for the bridge's reqwest client (the workspace builds
# reqwest with `rustls-no-provider`, ADR 0014); the bridge itself only talks
# plain HTTP to 127.0.0.1.
nail-auth.workspace = true
# Server side plus the Streamable HTTP client the stdio bridge forwards with.
# `elicitation` (M4a): confirmations are also asked in the MCP client's own
# form where it supports one (adds `url`, MIT / Apache-2.0, already in the lock).
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "elicitation",
] }
# M4a: prompt templates, confirmation values and elicitation texts are
# rendered from the Fluent catalogs (core-mcp.ftl) in the core's locale.
nail-config.workspace = true
# M4a: `create_event` / `update_event` read an agent's RRULE text.
nail-ical.workspace = true
reqwest.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["io-std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
# M3a: calendar ranges and working hours of the PIM tools.
chrono.workspace = true
chrono-tz.workspace = true
# Bearer tokens (32 random bytes from the OS).
getrandom = "0.3.4"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
