[package]
name = "nail-proto-pop3"
description = "POP3 client (in-house) with STLS, SASL, UIDL and leave-on-server policies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nail-api.workspace = true
nail-net = { workspace = true, features = ["io", "tls"] }
# The connection log (ADR 0190).
nail-connlog.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
base64.workspace = true
md5 = { package = "md-5", version = "0.11" }

[dev-dependencies]
# The fixed test instants (ADR 0171).
nail-util.workspace = true
nail-testkit-net.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
