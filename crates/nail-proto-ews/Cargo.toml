[package]
name = "nail-proto-ews"
description = "Exchange Web Services engine for Nail's Exchange Server (on-premises) accounts: SOAP client, SyncFolderHierarchy / SyncFolderItems, MimeContent, item writes, streaming notifications, calendar, contacts, tasks, OOF, inbox rules, rooms, delegates and shared mailboxes; plus a loopback mock EWS SOAP server (feature `testing`)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The mock EWS SOAP server (`nail_proto_ews::testing`): loopback only
# (ADR 0057), recorded-response fixtures. Used by this crate's tests, the
# core's tests and the demo-multi seed (WP95).
testing = ["dep:axum"]

[dependencies]
nail-api.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
# HTTP: the workspace reqwest (TLS from nail-auth, ring). Logins: Basic
# over TLS, OAuth2 bearer (nail_api::engine::AccessTokenProvider) and
# Windows Negotiate / Kerberos / NTLM through
# nail_api::exchange::engine::NegotiateAuth (SSPI lives in nail-exchange;
# this crate has no platform code).
reqwest.workspace = true
nail-auth.workspace = true
url.workspace = true
# SOAP bodies (the same XML library as Autodiscover and DAV; MIT).
quick-xml.workspace = true
# Fixtures and the JSON parts of Autodiscover answers in tests.
serde.workspace = true
serde_json.workspace = true
# MimeContent is base64; Negotiate tokens are base64 in headers.
base64.workspace = true
# Times (EWS dateTime, time zones are mapped by nail-exchange).
chrono.workspace = true
# The mock server (feature `testing`); MIT, already in the workspace.
axum = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
nail-proto-ews = { path = ".", features = ["testing"] }

[lints]
workspace = true
