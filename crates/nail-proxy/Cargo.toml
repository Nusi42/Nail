[package]
name = "nail-proxy"
description = "SSRF-safe remote-content proxy for Nail: signed URLs derived from messages, private-range blocking, size and type limits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nail-api.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
# Fetching: the workspace reqwest (rustls without a default provider; the
# caller passes the ring-based TLS config) with a resolver that refuses
# private, link-local and loopback answers (DNS rebinding).
reqwest.workspace = true
hickory-resolver.workspace = true
url.workspace = true
ipnet.workspace = true
# Signed, expiring proxy tokens (HMAC-SHA-256).
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
nail-testkit-net.workspace = true

[lints]
workspace = true
