[package]
name = "nail-proxy"
description = "SSRF-safe remote-content proxy for Nail: signed URLs derived from messages, private-range blocking, size and type limits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test hooks only (never in a release build): lets integration tests reach a
# mock server on one loopback port (`Fetcher::allow_loopback_port_for_tests`).
test-support = ["dep:tokio-rustls"]

[dependencies]
nail-api.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
# Fetching: the workspace reqwest (rustls without a default provider; the
# caller passes the ring-based TLS config). DNS answers are checked here and
# the connection is pinned to the checked addresses (no DNS rebinding).
reqwest.workspace = true
rustls.workspace = true
url.workspace = true
ipnet.workspace = true
# Signed, expiring proxy tokens (HMAC-SHA-256) with a per-install key.
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true
zeroize.workspace = true
# Only for the HTTPS mock upstream of `testing` (feature `test-support`).
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
nail-proxy = { workspace = true, features = ["test-support"] }
rcgen.workspace = true

[lints]
workspace = true
