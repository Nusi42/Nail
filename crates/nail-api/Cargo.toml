[package]
name = "nail-api"
description = "Transport-agnostic Nail API contract: domain types, resolved theme/layout models and the request/response/event protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
# M4a: JSON Schemas of the MCP tool / prompt arguments (`json-schema`).
schemars = { workspace = true, optional = true }

[features]
# Derive `schemars::JsonSchema` for the MCP tool and prompt arguments
# (`mcp::tools`, `mcp::prompts`); enabled by nail-mcp.
json-schema = ["dep:schemars"]

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
