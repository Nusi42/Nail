[package]
name = "nail-discovery"
description = "Account autoconfiguration: ISPDB, autoconfig, RFC 6186 SRV, Autodiscover, host guessing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nail-api.workspace = true
# The connection log (ADR 0190).
nail-connlog.workspace = true
nail-auth.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest.workspace = true
url.workspace = true
hickory-resolver.workspace = true
quick-xml.workspace = true

# SRV / MX lookups through the OS resolver (DnsQuery_W): Nail opens no DNS
# sockets of its own on Windows (ADR 0057). hickory-resolver stays for the
# loopback mock DNS server (tests, seeds) and as the non-Windows fallback.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_NetworkManagement_Dns"] }

[dev-dependencies]
nail-testkit-net.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
