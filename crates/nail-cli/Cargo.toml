[package]
name = "nail-cli"
description = "The nail command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nail-api.workspace = true
nail-config.workspace = true
nail-core = { workspace = true, features = ["demo"] }
nail-server.workspace = true
nail-mcp.workspace = true
# The data directory's single-instance lock and the MCP settings (M2c).
nail-store.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true
open.workspace = true
tempfile.workspace = true
# `nail plugin dev` talks to the running `nail serve` over its WebSocket (M2d).
tokio-tungstenite.workspace = true
futures-util.workspace = true
url.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[[bin]]
name = "nail"
path = "src/main.rs"
