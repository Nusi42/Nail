[package]
name = "nail-pkcs11"
description = "PKCS#11 smartcards and security tokens for Nail: loading modules, listing tokens, keys and certificates, signing and decrypting on the card with PIN prompts (OpenPGP and S/MIME)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# M4c WP122 (contract ADR 0094, decisions ADR 0095). cryptoki
# (Apache-2.0) loads the vendor's PKCS#11 DLL at run time (libloading);
# pre-generated bindings, no bindgen / libclang, no OpenSSL.
[features]
# An in-memory soft token with real RSA / P-256 keys for tests of the
# crypto crates (no hardware, no SoftHSM).
testing = ["dep:p256", "dep:rand", "dep:sha1", "dep:sha2-legacy"]

[dependencies]
nail-api.workspace = true
nail-util.workspace = true
cryptoki.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
hex.workspace = true
sha2.workspace = true
# Certificate facts of token objects; public keys from certificates.
x509-cert.workspace = true
der.workspace = true
const-oid.workspace = true
rsa.workspace = true
# The soft token (feature `testing`).
p256 = { workspace = true, features = ["ecdsa", "ecdh"], optional = true }
rand = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2-legacy = { workspace = true, optional = true }

[dev-dependencies]
# The integration tests use the soft token.
nail-pkcs11 = { workspace = true, features = ["testing"] }
pretty_assertions.workspace = true
tempfile.workspace = true
p256 = { workspace = true, features = ["ecdsa", "ecdh"] }
rand.workspace = true
sha1.workspace = true
sha2-legacy.workspace = true
nail-testkit.workspace = true

[lints]
workspace = true
