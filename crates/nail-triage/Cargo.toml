[package]
name = "nail-triage"
description = "Pure logic for Nail's triage: the per-account Bayesian junk classifier, the snooze scheduler and the notification policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nail-api.workspace = true
thiserror.workspace = true
serde_json.workspace = true
# Local time for quiet hours and wake times (clock + the OS time zone).
chrono.workspace = true
# Calendar zones of events and tasks for reminder times (M3a WP73).
chrono-tz.workspace = true
# Word boundaries for the tokenizer (UAX #29).
unicode-segmentation.workspace = true
# Training keys bound to the message content (review fix, ADR 0049).
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
# Calendar arithmetic of the test time zones (ADR 0171).
nail-util.workspace = true
# Sample contract values and test instants (`nail_api::testing`).
nail-api = { workspace = true, features = ["testing"] }
pretty_assertions.workspace = true
# Property tests (tokenizer, timer wheel, quiet hours); same as nail-search.
proptest = "1.11"

[lints]
workspace = true
