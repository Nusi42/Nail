[package]
name = "nail-sieve"
description = "Server-side rules for Nail: rules and vacation replies compiled to Sieve (RFC 5228), a ManageSieve client (RFC 5804)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nail-api.workspace = true
# The connection log (ADR 0190).
nail-connlog.workspace = true
thiserror.workspace = true
tracing.workspace = true
# ManageSieve client: tokio + rustls (ring provider chosen by the caller,
# like the IMAP / SMTP engines; STARTTLS and implicit TLS); SASL PLAIN /
# XOAUTH2 need base64. No OpenSSL, no aws-lc.
tokio.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
# Server certificates checked against the OS trust store (like IMAP / POP3).
rustls-platform-verifier.workspace = true
base64.workspace = true
# `:regex` validation of rule patterns before compiling.
regex.workspace = true
# The rule's Rust regex parsed into an AST and rewritten as POSIX ERE (the
# Sieve `regex` extension's dialect). Already in the lock through `regex`
# (MIT / Apache-2.0).
regex-syntax = "0.8.11"
# SHA-256 of uploaded scripts (the store records it).
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
nail-connlog.workspace = true
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
nail-testkit.workspace = true
nail-testkit-net.workspace = true

[lints]
workspace = true
