[package]
name = "nail-proto-graph"
description = "Microsoft Graph engine for Nail's Exchange Online accounts: per-folder mail deltas, MIME, calendars, contacts, To Do, mailbox settings, inbox rules, Focused Inbox, shared mailboxes, rooms, throttling, batching; plus a loopback mock Graph server (feature `testing`)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The mock Graph server (`nail_proto_graph::testing`): loopback only
# (ADR 0057), recorded-response fixtures. Used by this crate's tests, the
# core's tests and the demo-multi seed (WP95).
testing = ["dep:axum"]

[dependencies]
nail-api.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
# HTTP: the workspace reqwest (rustls without a default provider; the
# ring TLS configuration with the platform verifier comes from nail-auth,
# like the Gmail, DAV and OAuth2 clients). Access tokens come through
# nail_api::engine::AccessTokenProvider.
reqwest.workspace = true
nail-auth.workspace = true
url.workspace = true
# Graph JSON resources, `$batch`, errors.
serde.workspace = true
serde_json.workspace = true
# MIME upload for sendMail / message creation (base64 text/plain bodies).
base64.workspace = true
# Times, Retry-After dates.
chrono.workspace = true
# The mock server (feature `testing`); MIT, already in the workspace.
axum = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
nail-proto-graph = { path = ".", features = ["testing"] }

[lints]
workspace = true
