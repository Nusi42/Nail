[package]
name = "nail-store"
description = "Local store: SQLite metadata, content-addressed blob store, operation queue, threading, drafts and outbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nail-api.workspace = true
# Shared civil-date helpers (ADR 0171).
nail-util.workspace = true
# Local wall-clock times across DST changes (one definition with the triage clock).
nail-triage.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tempfile.workspace = true
# `functions`: the nail_seal / nail_open SQL functions (encryption at rest).
rusqlite = { workspace = true, features = ["functions"] }
zstd = "0.14.0"
sha2.workspace = true
hex.workspace = true
base64.workspace = true
# M4c WP122: database keys are zeroed on drop.
zeroize.workspace = true
futures-util.workspace = true
# PIM (M3a WP73): calendar times to instants for the instance cache and
# range columns (IANA zones, DST gaps / repeats).
chrono.workspace = true
chrono-tz.workspace = true

[features]
# Test support for this crate's and other crates' tests (`nail_store::testing`).
testing = ["nail-api/testing"]

[dev-dependencies]
# The crate's own test support (`nail_store::testing`) for its integration tests.
nail-store = { workspace = true, features = ["testing"] }
nail-api = { workspace = true, features = ["testing"] }
pretty_assertions.workspace = true

[lints]
workspace = true
