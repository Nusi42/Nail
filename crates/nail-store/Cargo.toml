[package]
name = "nail-store"
description = "Local store: SQLite metadata, content-addressed blob store, operation queue, threading, drafts and outbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nail-api.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tempfile.workspace = true
# `functions`: the nail_seal / nail_open SQL functions (encryption at rest).
rusqlite = { workspace = true, features = ["functions"] }
zstd = "0.14.0"
sha2.workspace = true
hex.workspace = true
base64.workspace = true
futures-util.workspace = true
# PIM (M3a WP73): calendar times to instants for the instance cache and
# range columns (IANA zones, DST gaps / repeats).
chrono.workspace = true
chrono-tz.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true

[lints]
workspace = true
