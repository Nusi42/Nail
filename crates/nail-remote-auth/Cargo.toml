[package]
name = "nail-remote-auth"
description = "Remote-UI authentication for Nail: passkeys, password + TOTP, pairing codes, device-bound sessions, rate limits, audit (axum handlers and middleware)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nail-api.workspace = true
# Users, credentials (hashed), devices, sessions, pairing codes, throttle
# counters and the audit log (schema v6).
nail-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
# The login route and the session middleware.
axum.workspace = true
cookie.workspace = true
# Passkeys (WebAuthn relying party; pure Rust, MIT / Apache-2.0).
webauthn_rp.workspace = true
# Passwords (Argon2id PHC strings) and TOTP (RFC 6238).
argon2.workspace = true
totp-rs.workspace = true
# Tokens, device secrets, pairing codes.
rand.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
zeroize.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tower.workspace = true

[lints]
workspace = true
