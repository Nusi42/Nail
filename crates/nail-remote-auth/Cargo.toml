[package]
name = "nail-remote-auth"
description = "Remote-UI authentication for Nail: passkeys, password + TOTP, pairing codes, device-bound sessions, rate limits, audit (axum handlers and middleware)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nail-api.workspace = true
# Users, credentials (hashed), devices, sessions, pairing codes, throttle
# counters and the audit log (schema v6).
nail-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
# RFC 3339 times from the store (session idle / re-authentication checks).
chrono.workspace = true
# The login route and the session middleware.
axum.workspace = true
cookie.workspace = true
# Passkeys (WebAuthn relying party; pure Rust, MIT / Apache-2.0). The
# relaxed JSON parsers accept what real browsers send (ADR 0036/0037).
webauthn_rp = { workspace = true, features = ["serde_relaxed"] }
# Passwords (Argon2id PHC strings) and TOTP (RFC 6238); secrets zeroized.
argon2 = { workspace = true, features = ["zeroize"] }
totp-rs = { workspace = true, features = ["zeroize"] }
# Tokens, device secrets, pairing codes; CSRF tokens (HMAC-SHA-256).
rand.workspace = true
base64.workspace = true
sha2.workspace = true
hmac.workspace = true
zeroize.workspace = true
# Constant-time comparison of CSRF tokens (BSD-3-Clause; already in the
# lock through the RustCrypto crates).
subtle = "2.6.1"

[dev-dependencies]
pretty_assertions.workspace = true
tower.workspace = true
# Software authenticator for the passkey tests (BSD-3-Clause; already in
# the lock through webauthn_rp).
ed25519-dalek = "2.2.0"

[lints]
workspace = true
