[package]
name = "nail-smime"
description = "S/MIME 4.0 for Nail: CMS sign / encrypt / decrypt / verify, PKCS#12 and Windows certificate store, chain validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nail-api.workspace = true
# Certificates and own keys live in the store's keyring (schema v5).
nail-store.workspace = true
cms.workspace = true
x509-cert.workspace = true
# `derive`: AuthEnvelopedData (RFC 5083), GCM parameters, SMIMECapabilities.
der = { workspace = true, features = ["derive", "oid", "pem"] }
spki.workspace = true
const-oid.workspace = true
rsa.workspace = true
# `ecdh`: ECDH key agreement recipients (RFC 5753).
p256 = { workspace = true, features = ["ecdh"] }
p384 = { workspace = true, features = ["ecdh"] }
ecdsa.workspace = true
aes.workspace = true
cbc = { workspace = true, features = ["alloc", "block-padding"] }
aes-gcm.workspace = true
sha1 = { workspace = true, features = ["oid"] }
sha2-legacy.workspace = true
rand.workspace = true
zeroize.workspace = true
p12-keystore.workspace = true
thiserror.workspace = true
chrono.workspace = true
base64.workspace = true
# RFC 3394 AES key wrap for ECDH recipients, PBKDF2 for passphrase-protected
# private keys (ADR 0031; MIT OR Apache-2.0).
aes-kw.workspace = true
pbkdf2.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
nail-testkit.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
