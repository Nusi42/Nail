[package]
name = "nail-vault"
description = "Encryption at rest for Nail: database, blob store and search index, key in the OS keychain, crash-safe migration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nail-api.workspace = true
# The vault state row (schema v5), sealed columns and the blob store.
nail-store.workspace = true
chacha20poly1305.workspace = true
rand.workspace = true
zeroize.workspace = true
# An encrypting tantivy `Directory` for the search index.
tantivy.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The data key in the keychain (hex) and atomic file rewrites.
hex.workspace = true
tempfile.workspace = true
# M4c WP122 (ADR 0095): the vault file next to the database (it must
# be readable while the database file is encrypted), RFC 3339 times of the
# recovery key, and key derivation (database key, recovery wrapping key).
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true

[dev-dependencies]
# Sample accounts, folders and messages (`nail_api::testing`, `nail_store::testing`).
nail-api = { workspace = true, features = ["testing"] }
nail-store = { workspace = true, features = ["testing"] }
pretty_assertions.workspace = true
# End-to-end: a real search index over the encrypted directory.
nail-search.workspace = true

[lints]
workspace = true
