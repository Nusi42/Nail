[package]
name = "nail-config"
description = "Theme and layout configuration: KDL parsing, validation, defaults, schema and file watching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Shared civil-date helpers (ADR 0171).
nail-util.workspace = true
nail-api.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
thiserror.workspace = true
tracing.workspace = true
kdl = { version = "6.7.1", default-features = false, features = ["span"] }
schemars = { version = "1.2.2", features = ["indexmap2"] }
notify-debouncer-mini.workspace = true
# Localized messages rendered in Rust (src/l10n.rs, M2c WP53).
fluent-bundle.workspace = true
unic-langid.workspace = true
# Theme ids from names without accents (M5d, ADR 0137).
unicode-normalization = "0.1.25"

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
