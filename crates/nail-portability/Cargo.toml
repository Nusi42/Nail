[package]
name = "nail-portability"
description = "Nail's data portability: importers (mbox, EML folders, Maildir, Thunderbird profiles, ICS, vCard), exporters (mbox, EML, Maildir, ICS, vCard), encrypted backup archives with verification and restore plans, and the diagnostics bundle writer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# M4c WP121 (contract ADR 0094). Readers and writers work on files and
# yield / take items; the core writes into the store and the queues.
# Licences: MIT / Apache-2.0 / Zlib only; no OpenSSL.
[dependencies]
nail-api.workspace = true
# Shared helpers (percent-decoding, the secret stand-in; ADR 0171).
nail-util.workspace = true
# Message parsing (headers, Message-ID, dates) and iCalendar / vCard.
nail-ical.workspace = true
mail-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
# Backup archives (ADR 0094 "Archive format"): zip (deflate via zlib-rs),
# Argon2id, XChaCha20-Poly1305 STREAM, SHA-256 entry hashes.
zip.workspace = true
argon2.workspace = true
chacha20poly1305 = { workspace = true, features = ["stream"] }
sha2.workspace = true
hex.workspace = true
rand.workspace = true
zeroize.workspace = true
# Thunderbird address books (abook.sqlite) and calendars (local.sqlite).
rusqlite.workspace = true
# Atomic replacement of confirmed overwrites (files.rs).
tempfile.workspace = true
base64.workspace = true

[features]
# Cheap Argon2id parameters (`KdfParams::insecure_for_tests`) for the
# tests of crates using this one; never enabled in builds that ship.
testing = []

[dev-dependencies]
pretty_assertions.workspace = true

[lints]
workspace = true
