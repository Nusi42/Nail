# typos (spell checker for code, docs and configs; quality baseline Q1,
# ADR 0123). `typos` = check, `typos --write-changes` = fix. Part of
# `npm run check` and the pre-commit hook. Add a word below only when it is
# legitimate (a protocol token, a name, test data) and say why.

[files]
extend-exclude = [
    # Lock files, binary or byte-exact test data, generated code.
    "Cargo.lock",
    "package-lock.json",
    "*.png",
    "*.eml",
    "*.asc",
    "*.key",
    "*.crt",
    "*.p12",
    "*.sig",
    "*.msf",
    "*.sqlite",
    "*.dat",
    "crates/nail-testkit/corpus/",
    "crates/*/tests/fixtures/",
    "e2e/visual/baselines/",
    "ui/src/api/generated/",
    "packages/plugin-api/src/generated/",
    "crates/nail-store/libsqlite3-sys-sqlite3mc/bindings/",
    # The duplicate check's generated baselines (hex fingerprints; keys quote code).
    "scripts/duplicates/*-baseline.json",
    # insta snapshots: recorded output of the (byte-exact) mail corpus.
    "*.snap",
    # German text: typos only knows English.
    "locales/de/",
    "**/locales/de.ftl",
    # Recorded iCalendar / vCard corpus (byte-exact, folded lines split words).
    "crates/nail-ical/tests/corpus/",
]

[default]
extend-ignore-re = [
    # Deliberate non-English text or misspellings (German test strings, a
    # broken config in an error example), marked at the narrowest scope:
    # one line ending in `spellchecker:disable-line`, or a block between
    # `spellchecker:off` and `spellchecker:on` comments (`//`, `#`, `<!--`).
    '(?Rm)^.*(#|//|<!--)\s*spellchecker:disable-line(\s*-->)?$',
    '(?s)(#|//|<!--)[^\n]*spellchecker:off.*?\n\s*(#|//|<!--)[^\n]*spellchecker:on',
    # Mork column definitions in Thunderbird address books, e.g. `(BA=AddrCharSet)`.
    '\(B[0-9A-F]=',
]

[default.extend-words]
# Protocol and format tokens.
HELO = "HELO"                     # SMTP greeting command (RFC 5321)
helo = "helo"
UNAUTHENTICATE = "UNAUTHENTICATE" # IMAP command (RFC 8437)
FPR = "FPR"                       # GnuPG colon-listing record type (fingerprint)
fpr = "fpr"
EDE = "EDE"                       # 3DES-EDE (encrypt-decrypt-encrypt)
cose = "cose"                     # COSE keys (WebAuthn, RFC 9052)
paeth = "paeth"                   # PNG Paeth filter
FLE = "FLE"                       # Windows time zone "FLE Standard Time"
SEH = "SEH"                       # Windows structured exception handling
THRID = "THRID"                   # Gmail IMAP attribute X-GM-THRID
alikes = "alikes"                 # "look-alikes" (typos splits hyphenated words)
Cpy = "Cpy"                       # NSIS StrCpy instruction
flate = "flate"                   # the flate2 crate and zip's deflate-flate2-* features
# German default folder names Nail recognizes ("Gesendete Elemente", "Archiv").
elemente = "elemente"
archiv = "archiv"
