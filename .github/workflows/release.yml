name: Release

# Release builds of the Windows packages (plan M4b WP112, ADR 0089):
# NSIS (per user), MSI (per machine) and the offline-WebView2 NSIS variant
# for x64 and ARM64, signed when a certificate is configured, with update
# signatures from the release update key; then the per-channel update
# manifests and the winget manifests. A tag push (v<version>) also creates a
# draft GitHub release with everything attached. Publishing the manifests at
# NAIL_UPDATE_BASE_URL (and the winget pull request) stays a manual step:
# packaging/README.md.
#
# Configuration (repository settings; nothing secret is in the repository):
#   secrets.NAIL_SIGN_PFX_BASE64 / NAIL_SIGN_PFX_PASSWORD  Authenticode (optional; unsigned without)
#   secrets.NAIL_UPDATER_PRIVATE_KEY / NAIL_UPDATER_KEY_PASSWORD  release update key
#   vars.NAIL_UPDATER_PUBKEY    its public half (embedded in Nail.exe)
#   vars.NAIL_UPDATE_BASE_URL   https base of <channel>/latest.json (optional: without it
#                               the app reports updates as not configured)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NAIL_BUILD_DIR: ${{ github.workspace }}/.nail-build

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    env:
      # Both halves or neither (scripts/lib/build.mjs updaterKeyFromEnv).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.NAIL_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NAIL_UPDATER_KEY_PASSWORD }}
      NAIL_UPDATER_PUBKEY: ${{ vars.NAIL_UPDATER_PUBKEY }}
      NAIL_UPDATE_BASE_URL: ${{ vars.NAIL_UPDATE_BASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-version.mjs --tag ${{ github.ref_name }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'x64' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}, i686-pc-windows-msvc

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Code-signing certificate (only when configured)
        shell: pwsh
        run: ./scripts/import-signing-cert.ps1
        env:
          NAIL_SIGN_PFX_BASE64: ${{ secrets.NAIL_SIGN_PFX_BASE64 }}
          NAIL_SIGN_PFX_PASSWORD: ${{ secrets.NAIL_SIGN_PFX_PASSWORD }}

      - name: Build installers
        run: node scripts/build-installer.mjs --arch ${{ matrix.arch }} --offline-webview --out .nail-build/dist

      - name: Authenticode signatures
        if: env.NAIL_SIGN_THUMBPRINT != ''
        shell: pwsh
        run: ./scripts/verify-signatures.ps1 -Folder .nail-build/dist

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: nail-release-${{ matrix.arch }}
          path: .nail-build/dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Manifests and draft release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      NAIL_UPDATER_PUBKEY: ${{ vars.NAIL_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download builds
        uses: actions/download-artifact@v7
        with:
          pattern: nail-release-*
          path: .nail-build/release

      - name: Version and channel
        shell: pwsh
        run: |
          "NAIL_VERSION=$(node scripts/release-version.mjs)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NAIL_CHANNEL=$(node scripts/release-version.mjs --channel)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # Every installer's .sig is checked against the public key and the
      # version before a manifest is written.
      - name: Update manifests
        if: env.NAIL_UPDATER_PUBKEY != ''
        shell: pwsh
        run: |
          $notes = "packaging/release-notes/$env:NAIL_VERSION.md"
          $notesArgs = if (Test-Path $notes) { @('--notes', $notes) } else { @() }
          node scripts/update-manifest.mjs --version $env:NAIL_VERSION --channel $env:NAIL_CHANNEL `
            --artifacts .nail-build/release/nail-release-x64 --artifacts .nail-build/release/nail-release-arm64 `
            --download-base "https://github.com/${{ github.repository }}/releases/download/v$env:NAIL_VERSION" `
            --out .nail-build/updates @notesArgs
          if ($LASTEXITCODE -ne 0) { throw 'update manifests failed' }

      - name: winget manifests
        run: node scripts/winget-manifest.mjs --version ${{ env.NAIL_VERSION }} --artifacts .nail-build/release/nail-release-x64 --artifacts .nail-build/release/nail-release-arm64 --installer-url-template "https://github.com/${{ github.repository }}/releases/download/v{{version}}/{{file}}" --out .nail-build/winget

      - name: Upload manifests
        uses: actions/upload-artifact@v7
        with:
          name: nail-release-manifests
          path: |
            .nail-build/updates/
            .nail-build/winget/
          if-no-files-found: warn
          retention-days: 90

      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem .nail-build/release -Recurse -File | ForEach-Object { $_.FullName }
          $prerelease = if ($env:NAIL_CHANNEL -eq 'beta') { @('--prerelease') } else { @() }
          gh release create "${{ github.ref_name }}" --draft --title "Nail $env:NAIL_VERSION" --notes "Draft: check, then publish. Update manifests and winget manifests are in the workflow artifacts." @prerelease @files
