name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Build output, Playwright traces/report (see e2e/support/nail.ts
  # buildOutputDir and scripts/lib/build.mjs buildBase). Gitignored.
  NAIL_BUILD_DIR: ${{ github.workspace }}/.nail-build

jobs:
  build-test:
    name: Lint and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: npm ci
        run: npm ci

      # The Tauri shell (app/src-tauri) embeds ui/dist at compile time, so the
      # UI is built before any `--workspace` cargo command.
      - name: Build UI
        run: npm run build

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: npm lint
        run: npm run lint

      - name: npm test (Vitest)
        run: npm test

      # Release helpers: SBOM, installer build options (scripts/test/).
      - name: Script tests
        run: node --test "scripts/test/*.test.mjs"

      # Playwright end-to-end tests against the prebuilt `nail serve --seed demo`
      # (e2e/README.md). ui/dist was built above; build the nail binary here.
      # The desktop smoke test runs in its own job ("desktop").
      - name: Build nail-cli
        run: cargo build -p nail-cli

      - name: Install Playwright browsers
        run: npx -w e2e playwright install --with-deps chromium

      - name: Playwright
        run: npm run e2e:only

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: .nail-build/e2e/
          retention-days: 14

  # Quality baseline (Q1, ADR 0123): every formatter check and linter with
  # zero warnings (`npm run check`: rustfmt, taplo, Prettier, EditorConfig,
  # typos, markdownlint, actionlint, ESLint, tsc, clippy and rustdoc with
  # -D warnings, cargo machete, cargo deny incl. advisories). Blocking.
  quality:
    name: Quality baseline (npm run check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # Tools from the package registries only (crates.io, PyPI).
      - name: Lint tools
        run: |
          cargo install taplo-cli cargo-machete cargo-deny --locked
          pip install -r requirements-dev.txt

      - name: npm ci
        run: npm ci

      # The Tauri shell embeds ui/dist at compile time (clippy, rustdoc).
      - name: Build UI
        run: npm run build

      - name: npm run check
        run: npm run check

  # The non-Windows `cfg` branches (Q1 review, ADR 0130): `quality` runs on
  # Windows, so clippy never compiles them there. Every crate with such a
  # branch, linted on Linux with the same workspace lints and -D warnings.
  # nail-app (WebKitGTK on Linux) and nail-mapi (a Windows DLL) are
  # Windows-only and stay out. Blocking.
  quality-linux:
    name: Quality baseline (clippy, non-Windows cfg branches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: clippy (non-Windows branches)
        run: cargo clippy --locked -p nail-core -p nail-discovery -p nail-exchange -p nail-smime -p nail-server -p nail-config -p nail-bench --all-targets -- -D warnings

  # The desktop smoke test (e2e/tests/desktop.spec.ts) drives the real
  # nail-app.exe over WebView2 (preinstalled on windows-latest).
  desktop:
    name: Desktop smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> .nail-build/desktop-target"

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Build UI
        run: npm run build

      # Playwright's config starts the shared `nail serve` for every run.
      - name: Build nail-cli
        run: cargo build -p nail-cli

      - name: Build desktop app
        run: npm run build:desktop

      - name: Install Playwright browsers
        run: npx -w e2e playwright install --with-deps chromium

      - name: Playwright (desktop)
        run: npm run e2e:only -- tests/desktop.spec.ts tests/desktop-m4b.spec.ts tests/desktop-m4c.spec.ts tests/desktop-m5c.spec.ts tests/p1-mail.spec.ts tests/p3-card-height.spec.ts
        env:
          NAIL_E2E_DESKTOP: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-desktop
          path: .nail-build/e2e/
          retention-days: 14

  # The Simple MAPI DLL (plan M4b WP111, ADR 0088) for every architecture
  # it ships for: the unit and DLL tests as x86 (32-bit Office) under WOW64
  # (x64 runs in build-test), release builds for x64, x86 and ARM64, and
  # every export checked on the built x64 and x86 DLLs by loading them like
  # a program does (an ARM64 DLL cannot be loaded on the x64 runner).
  mapi:
    name: Simple MAPI DLL (x64, x86, ARM64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Tests (x86 under WOW64)
        run: cargo test -p nail-mapi --target i686-pc-windows-msvc

      - name: Release builds
        run: |
          cargo build -p nail-mapi --release
          cargo build -p nail-mapi --release --target i686-pc-windows-msvc
          cargo build -p nail-mapi --release --lib --target aarch64-pc-windows-msvc

      - name: Exports
        shell: pwsh
        run: |
          ./target/release/nail-mapi-harness.exe exports --dll target/release/nail_mapi.dll
          if ($LASTEXITCODE -ne 0) { throw 'x64 DLL: an export is missing' }
          ./target/i686-pc-windows-msvc/release/nail-mapi-harness.exe exports --dll target/i686-pc-windows-msvc/release/nail_mapi.dll
          if ($LASTEXITCODE -ne 0) { throw 'x86 DLL: an export is missing' }
          if (-not (Test-Path target/aarch64-pc-windows-msvc/release/nail_mapi.dll)) { throw 'no ARM64 DLL' }

      # ADR 0093: a shipped DLL must not read the test-only variables.
      - name: No test overrides in release DLLs
        shell: pwsh
        run: |
          foreach ($dll in 'target/release/nail_mapi.dll', 'target/i686-pc-windows-msvc/release/nail_mapi.dll', 'target/aarch64-pc-windows-msvc/release/nail_mapi.dll') {
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($dll))
            foreach ($name in 'NAIL_MAPI_PIPE', 'NAIL_MAPI_APP') {
              if ($text.Contains($name)) { throw "$dll reads $name (test-overrides enabled?)" }
            }
          }

  # The installers (plan M4b WP112, ADR 0089): per-user NSIS, the
  # per-machine MSI, the offline-WebView2 NSIS variant, portable zip, SBOMs,
  # update signatures. Then install -> launch -> update -> uninstall for the
  # NSIS installer and install -> launch -> upgrade -> uninstall for the MSI,
  # against a loopback update server (scripts/update-server.mjs). These CI
  # builds carry the loopback update URL and a throwaway update key, so they
  # are test builds; releases come from release.yml. Signed only when the
  # NAIL_SIGN_PFX_BASE64 secret exists.
  installer:
    name: Installers + install/update smoke (Windows x64)
    runs-on: windows-latest
    env:
      NAIL_SMOKE_UPDATE_BASE: http://127.0.0.1:47811
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # x86 for the 32-bit NailMapi.dll (32-bit Office).
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> .nail-build/installer-target"

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Code-signing certificate (only when configured)
        shell: pwsh
        run: ./scripts/import-signing-cert.ps1
        env:
          NAIL_SIGN_PFX_BASE64: ${{ secrets.NAIL_SIGN_PFX_BASE64 }}
          NAIL_SIGN_PFX_PASSWORD: ${{ secrets.NAIL_SIGN_PFX_PASSWORD }}

      # A key made for this run only: the smoke test checks signed updates
      # without any secret. The release key never appears in this workflow.
      - name: Throwaway update key, versions
        shell: pwsh
        run: |
          $dir = Join-Path $env:NAIL_BUILD_DIR 'smoke-key'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $password = [Guid]::NewGuid().ToString('N')
          Write-Host "::add-mask::$password"
          npx tauri signer generate --ci -p $password -w "$dir\smoke.key"
          if ($LASTEXITCODE -ne 0) { throw 'tauri signer generate failed' }
          "TAURI_SIGNING_PRIVATE_KEY=$dir\smoke.key" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NAIL_UPDATER_PUBKEY_FILE=$dir\smoke.key.pub" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $version = node scripts/release-version.mjs
          $next = node scripts/release-version.mjs --next
          "NAIL_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NAIL_NEXT_VERSION=$next" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # Builds the UI, the static-CRT CLI and MAPI DLLs, Nail.exe, then
      # bundles. The bundler downloads NSIS, WiX 3.14 and the WebView2
      # bootstrapper / offline runtime.
      - name: Build installers
        run: node scripts/build-installer.mjs --offline-webview --update-base ${{ env.NAIL_SMOKE_UPDATE_BASE }} --insecure-loopback-updates --out .nail-build/dist

      - name: Build the next version (the update)
        run: node scripts/build-installer.mjs --skip-ui --no-portable --version ${{ env.NAIL_NEXT_VERSION }} --update-base ${{ env.NAIL_SMOKE_UPDATE_BASE }} --insecure-loopback-updates --out .nail-build/dist-next

      - name: Authenticode signatures
        if: env.NAIL_SIGN_THUMBPRINT != ''
        shell: pwsh
        run: ./scripts/verify-signatures.ps1 -Folder .nail-build/dist

      - name: Loopback update server
        shell: pwsh
        run: |
          $root = Join-Path $env:NAIL_BUILD_DIR 'update-server'
          New-Item -ItemType Directory -Force $root | Out-Null
          node scripts/update-manifest.mjs --version $env:NAIL_NEXT_VERSION --channel stable `
            --artifacts .nail-build/dist-next --download-base $env:NAIL_SMOKE_UPDATE_BASE --out $root
          if ($LASTEXITCODE -ne 0) { throw 'update manifest failed' }
          Copy-Item .nail-build/dist-next/*-setup.exe, .nail-build/dist-next/*.msi -Destination $root
          $port = Join-Path $env:NAIL_BUILD_DIR 'update-server.port'
          Start-Process node -ArgumentList @('scripts/update-server.mjs', '--root', $root, '--port', '47811', '--port-file', $port, '--log', (Join-Path $env:NAIL_BUILD_DIR 'update-server.log'))
          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path $port) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
          if (-not (Test-Path $port)) { throw 'update server did not start' }
          Get-Content (Join-Path $root 'stable/latest.json')

      - name: NSIS smoke (install, launch, update, uninstall)
        shell: pwsh
        run: ./scripts/installer-smoke.ps1 -Installer ".nail-build/dist/Nail_${env:NAIL_VERSION}_x64-setup.exe" -UpdateEndpoint "$env:NAIL_SMOKE_UPDATE_BASE/stable/latest.json" -UpdatePubkey $env:NAIL_UPDATER_PUBKEY_FILE

      - name: MSI smoke (silent install with properties, launch, upgrade, uninstall)
        shell: pwsh
        run: ./scripts/msi-smoke.ps1 -Msi ".nail-build/dist/Nail_${env:NAIL_VERSION}_x64_en-US.msi" -UpgradeMsi ".nail-build/dist-next/Nail_${env:NAIL_NEXT_VERSION}_x64_en-US.msi"
        env:
          NAIL_MSI_SMOKE_LOGS: ${{ github.workspace }}/.nail-build

      - name: winget manifests
        run: node scripts/winget-manifest.mjs --version ${{ env.NAIL_VERSION }} --artifacts .nail-build/dist --installer-url-template "https://github.com/${{ github.repository }}/releases/download/v{{version}}/{{file}}" --out .nail-build/winget

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: nail-windows-x64-ci
          path: |
            .nail-build/dist/*.exe
            .nail-build/dist/*.msi
            .nail-build/dist/*.sig
            .nail-build/dist/*-portable.zip
            .nail-build/dist/*.cdx.json
            .nail-build/dist/*-SHA256SUMS.txt
            .nail-build/winget/
          if-no-files-found: error
          retention-days: 30

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-smoke-logs
          path: .nail-build/*.log
          if-no-files-found: ignore
          retention-days: 14

  # ARM64 installers, cross-built on x64 (ring needs clang, preinstalled on
  # windows-latest). Not run here (no ARM64 runner); the x64 smoke covers
  # the installer logic, which is the same.
  installer-arm64:
    name: Installers (Windows ARM64, cross-built)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc, i686-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> .nail-build/installer-target"

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Code-signing certificate (only when configured)
        shell: pwsh
        run: ./scripts/import-signing-cert.ps1
        env:
          NAIL_SIGN_PFX_BASE64: ${{ secrets.NAIL_SIGN_PFX_BASE64 }}
          NAIL_SIGN_PFX_PASSWORD: ${{ secrets.NAIL_SIGN_PFX_PASSWORD }}

      - name: Build installers
        run: node scripts/build-installer.mjs --arch arm64 --out .nail-build/dist

      - name: Authenticode signatures
        if: env.NAIL_SIGN_THUMBPRINT != ''
        shell: pwsh
        run: ./scripts/verify-signatures.ps1 -Folder .nail-build/dist

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: nail-windows-arm64-ci
          path: |
            .nail-build/dist/*.exe
            .nail-build/dist/*.msi
            .nail-build/dist/*-portable.zip
            .nail-build/dist/*.cdx.json
            .nail-build/dist/*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # The 100k-message performance benchmark (M4c WP123 / WP125, ADR 0097):
  # sync from the mock IMAP server, search, list pages, cold start, memory,
  # then first render and scrolling in Playwright, checked against
  # e2e/perf/budgets.json with the CI tolerance. The exit code of
  # run-perf.mjs is the result (1 = a budget exceeded or a scenario failed,
  # 2 = setup error); the reports are uploaded either way.
  perf:
    name: Performance budgets (100k messages)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Install Playwright browsers
        run: npx -w e2e playwright install --with-deps chromium

      - name: Build UI
        run: npm run build -w ui

      - name: Build nail and nail-bench (release)
        run: cargo build --release -p nail-cli -p nail-bench

      - name: Benchmark
        run: node e2e/perf/run-perf.mjs --corpus standard --tolerant
        env:
          NAIL_BUILD_DIR: ${{ runner.temp }}/nail-build

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: |
            ${{ runner.temp }}/nail-build/perf/standard/report*.json
            ${{ runner.temp }}/nail-build/perf/standard/scroll-trace.json
          retention-days: 30

  # Visual regression (M5a, ADR 0106): built-in themes x densities against
  # e2e/visual/baselines/win32, plus the harness self-test. Non-blocking until a
  # CI run confirms the runner renders like the reference machine (fonts:
  # Segoe UI Variable); then delete continue-on-error.
  visual:
    name: Visual regression (themes x densities)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Install Playwright browsers
        run: npx -w e2e playwright install --with-deps chromium

      - name: Build UI
        run: npm run build -w ui

      - name: Build nail-cli
        run: cargo build -p nail-cli

      - name: Harness self-test
        run: npm run visual:selftest

      - name: Visual regression
        run: npm run visual

      - name: Upload review page
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-review
          path: |
            .nail-build/visual/review/
            .nail-build/visual-selftest/review/
          retention-days: 14

  # Licences (no GPL / LGPL / AGPL), advisories (RustSec; the rsa 0.9
  # exception is recorded in deny.toml), banned crates (OpenSSL, aws-lc),
  # sources.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

  # The IMAP / POP3 / SMTP engines against real servers: Dovecot and
  # Stalwart in Docker (scripts/interop/). Started with `docker run` after
  # the checkout, not as `services:`, because the containers need the
  # config files and certificates from the repository.
  interop:
    name: Interop (Dovecot, Stalwart, Radicale)
    runs-on: ubuntu-latest
    env:
      DOVECOT_IMAGE: dovecot/dovecot:2.3.21
      STALWART_IMAGE: stalwartlabs/stalwart:latest
      # CalDAV / CardDAV (M3a, ADR 0060); NAIL_INTEROP_RADICALE=0 skips it.
      RADICALE_IMAGE: tomsquest/docker-radicale:latest
      CERTS: ${{ github.workspace }}/.nail-build/interop-certs
    steps:
      - uses: actions/checkout@v7

      - name: Certificates
        run: bash scripts/interop/gen-certs.sh "$CERTS"

      - name: Start Dovecot, Stalwart and Radicale
        run: bash scripts/interop/start-servers.sh "$CERTS"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The interop crate is its own workspace; pin it to the main lock file.
      - name: Lock file
        run: cp Cargo.lock scripts/interop/Cargo.lock

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: scripts/interop

      # Not part of the main workspace, so `npm run check` does not lint it.
      - name: clippy (interop crate)
        run: cargo clippy --manifest-path scripts/interop/Cargo.toml --all-targets -- -D warnings

      - name: Interop tests
        run: cargo test --manifest-path scripts/interop/Cargo.toml -- --test-threads=1
        env:
          NAIL_INTEROP: "1"
          NAIL_INTEROP_CA: ${{ env.CERTS }}/ca.pem
          NAIL_INTEROP_SERVERS: dovecot=localhost:10000:sieve,stalwart=localhost:20000:smtp:sieve
          NAIL_INTEROP_DAV: radicale=https://localhost:5232/
          NAIL_INTEROP_USER: ada@example.org
          NAIL_INTEROP_PASSWORD: nail-interop

      - name: Server logs
        if: always()
        run: |
          docker logs nail-dovecot || true
          docker logs nail-stalwart || true
          docker logs nail-radicale || true
