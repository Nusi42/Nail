[package]
name = "nail-app"
description = "Nail desktop shell (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nail_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nail-app"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
nail-api.workspace = true
nail-core = { workspace = true, features = ["demo"] }
# The remote UI (TLS + login) and the remote-content proxy (ADR 0041).
nail-server.workspace = true
nail-proxy.workspace = true
tauri-plugin-single-instance.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true

# Installer helper (setup_helper.rs): per-user PATH, Credential Manager.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.6.1"

[dev-dependencies]
pretty_assertions.workspace = true

[lints]
workspace = true
