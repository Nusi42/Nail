[package]
name = "nail-app"
description = "Nail desktop shell (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nail_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nail-app"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
nail-api.workspace = true
nail-core = { workspace = true, features = ["demo"] }
# The remote UI (TLS + login) and the remote-content proxy (ADR 0041).
nail-server.workspace = true
nail-proxy.workspace = true
tauri-plugin-single-instance.workspace = true
# OS notifications for new mail (M2c; shown from Rust, ADR 0043).
tauri-plugin-notification.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
# M4b (ADR 0087; WP113): the updater, the `nail plugin dev` endpoint
# (loopback WebSocket, token), the Simple MAPI pipe protocol (nail_api::mapi).
tauri-plugin-updater.workspace = true
axum.workspace = true
futures-util.workspace = true

# Installer helper (setup_helper.rs): per-user PATH, Credential Manager.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging"] }
windows-registry.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
# M4b: dev-endpoint tests connect like `nail plugin dev`.
tokio-tungstenite.workspace = true

[lints]
workspace = true
